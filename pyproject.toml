[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "car2lgeo-3d-llm"
version = "0.1.0"
description = "GPT image references, LLM-driven Blender modelling, and LEGO Studio export"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1",
  "numpy==1.26.4", "scipy==1.14.1", "scikit-image==0.24.0",
  "trimesh==4.5.3", "rtree==1.3.0", "Pillow==10.4.0",
  "huggingface-hub==0.25.2", "transformers==4.42.4", "diffusers==0.30.3",
  "accelerate==0.34.2", "safetensors==0.4.5", "omegaconf==2.3.0",
  "einops==0.8.0", "jaxtyping==0.2.36", "rembg==2.0.59",
  "onnxruntime==1.19.2", "imageio==2.36.0", "imageio-ffmpeg==0.5.1",
  "matplotlib==3.9.2", "jsonschema==4.26.0", "httpx==0.28.1", "beautifulsoup4==4.14.2",
  "python-dotenv==1.2.4"
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
brands = ["httpx==0.28.1", "beautifulsoup4==4.14.2"]
native = ["ldraw-mcp==0.3.1"]
brickwright = ["bricklayer-sdk==0.1.0"]
multiview = ["pymeshlab==2023.12.post3", "pygltflib==1.16.3", "opencv-python==4.10.0.84"]
gpt = ["openai>=2.20,<3", "langchain-openai>=1,<2", "pydantic-settings>=2,<3"]
blender = ["mcp>=1.26,<2"]

[project.scripts]
car2lego3d = "car2lego3d.cli:main"
car2lgeo3dllm = "car2lego3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
